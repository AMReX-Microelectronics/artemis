name: 🐧 OpenMP

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ubuntu
  cancel-in-progress: true

jobs:
  build_cxxminimal:
    name: GCC Minimal w/o MPI
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      CXXFLAGS: "-Werror"
    steps:
    - uses: actions/checkout@v3
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
    - name: CCache Cache
      uses: actions/cache@v3
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-openmp-cxxminimal-${{ hashFiles('.github/workflows/ubuntu.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
        restore-keys: |
          ccache-openmp-cxxminimal-${{ hashFiles('.github/workflows/ubuntu.yml') }}-
          ccache-openmp-cxxminimal-
    - name: build WarpX
      run: |
        cmake -S . -B build_3D         \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_EB=OFF               \
          -DWarpX_MPI=OFF              \
          -DWarpX_QED=OFF
        cmake --build build_3D -j 2

        cmake -S . -B build_3D_EM      \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_EB=OFF               \
          -DWarpX_MPI=OFF              \
          -DWarpX_QED=OFF              \
          -DWarpX_MAG_LLG=OFF
        cmake --build build_3D_EM -j 2

  build_3D_MPI_gnumake:
    name: GCC 3D w/ MPI GNUmake (USE_LLG=${{ matrix.llg }})
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        llg: [FALSE, TRUE]
    steps:
    - uses: actions/checkout@v3
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: CCache Cache
      uses: actions/cache@v3
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-openmp-3D-MPI-gnumake-llg${{ matrix.llg }}-${{ hashFiles('.github/workflows/ubuntu.yml') }}-${{ hashFiles('dependencies.json') }}
        restore-keys: |
          ccache-openmp-3D-MPI-gnumake-llg${{ matrix.llg }}-${{ hashFiles('.github/workflows/ubuntu.yml') }}-
          ccache-openmp-3D-MPI-gnumake-llg${{ matrix.llg }}-
    - name: build WarpX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        # AMReX at the commit pinned in dependencies.json, next to the repo (GNUmakefile expects ../amrex)
        git clone https://github.com/AMReX-Codes/amrex.git ../amrex
        git -C ../amrex checkout --detach $(jq -r .commit_amrex dependencies.json)

        make -j 2 DIM=3 USE_MPI=TRUE USE_LLG=${{ matrix.llg }} USE_CCACHE=TRUE

        ccache -s

  build_gcc_ablastr:
    name: GCC ABLASTR w/o MPI
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      CMAKE_GENERATOR: Ninja
      CXXFLAGS: "-Werror"
    steps:
    - uses: actions/checkout@v3
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: CCache Cache
      uses: actions/cache@v3
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-openmp-gccablastr-${{ hashFiles('.github/workflows/ubuntu.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
        restore-keys: |
          ccache-openmp-gccablastr-${{ hashFiles('.github/workflows/ubuntu.yml') }}-
          ccache-openmp-gccablastr-
    - name: build WarpX
      run: |
        cmake -S . -B build            \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DWarpX_APP=OFF              \
          -DWarpX_LIB=OFF
        cmake --build build -j 2
