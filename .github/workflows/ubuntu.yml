name: 🐧 GCC

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-gcc
  cancel-in-progress: true

jobs:
  build_gnumake:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            llg: FALSE
          - name: GCC with LLG
            llg: TRUE
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: CCache Cache
      uses: actions/cache@v4
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-gcc-llg${{ matrix.llg }}-${{ hashFiles('.github/workflows/ubuntu.yml') }}-${{ hashFiles('dependencies.json') }}
        restore-keys: |
          ccache-gcc-llg${{ matrix.llg }}-${{ hashFiles('.github/workflows/ubuntu.yml') }}-
          ccache-gcc-llg${{ matrix.llg }}-
    - name: build
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        # AMReX at the commit pinned in dependencies.json, next to the repo (GNUmakefile expects ../amrex)
        git clone https://github.com/AMReX-Codes/amrex.git ../amrex
        git -C ../amrex checkout --detach $(jq -r .commit_amrex dependencies.json)

        make -j 2 DIM=3 USE_MPI=TRUE USE_OMP=FALSE USE_LLG=${{ matrix.llg }} USE_CCACHE=TRUE

        ccache -s
