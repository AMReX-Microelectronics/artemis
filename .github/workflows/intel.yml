name: 🐧 Intel

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-intel
  cancel-in-progress: true

jobs:

  build_icpx:
    name: oneAPI ICX SP
    runs-on: ubuntu-24.04
    # Since 2021.4.0, AMReX_GpuUtility.H: error: comparison with NaN
    # always evaluates to false in fast floating point modes
    # oneAPI 2022.2.0 hangs for -O2 and higher:
    #   https://github.com/ECP-WarpX/WarpX/issues/3442
    env:
      CXXFLAGS: "-Werror -Wno-error=pass-failed \
        -Wno-tautological-constant-compare"
    # For oneAPI, Ninja is slower than the default:
    #  CMAKE_GENERATOR: Ninja
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        shell: bash
        run: |
          .github/workflows/dependencies/dpcpp.sh
      - name: CCache Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-intel-icpx-${{ hashFiles('.github/workflows/intel.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
          restore-keys: |
            ccache-intel-icpx-${{ hashFiles('.github/workflows/intel.yml') }}-
            ccache-intel-icpx-
      - name: build WarpX
        shell: bash
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=10
          export CCACHE_MAXSIZE=100M
          export CCACHE_DEPEND=1
          ccache -z

          set +e
          source /opt/intel/oneapi/setvars.sh
          set -e
          export CXX=$(which icpx)
          export CC=$(which icx)

          cmake -S . -B build_sp         \
            -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_VERBOSE_MAKEFILE=ON  \
            -DWarpX_EB=ON                \
            -DWarpX_LIB=ON               \
            -DWarpX_MPI=OFF              \
            -DWarpX_OPENPMD=ON           \
            -DWarpX_PRECISION=SINGLE
          cmake --build build_sp -j 2

  build_dpcc:
    name: oneAPI DPC++ SP
    runs-on: ubuntu-24.04
    # Since 2021.4.0, AMReX_GpuUtility.H: error: comparison with NaN
    # always evaluates to false in fast floating point modes
    # oneAPI 2022.2.0 hangs for -O2 and higher:
    #   https://github.com/ECP-WarpX/WarpX/issues/3442
    env:
      CXXFLAGS: "-Werror -Wno-tautological-constant-compare"
    # For oneAPI, Ninja is slower than the default:
    #  CMAKE_GENERATOR: Ninja
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        shell: bash
        run: |
          .github/workflows/dependencies/dpcpp.sh
      - name: CCache Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-intel-dpcc-${{ hashFiles('.github/workflows/intel.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
          restore-keys: |
            ccache-intel-dpcc-${{ hashFiles('.github/workflows/intel.yml') }}-
            ccache-intel-dpcc-
      - name: build WarpX
        shell: bash
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=10
          export CCACHE_MAXSIZE=100M
          export CCACHE_DEPEND=1
          ccache -z

          set +e
          source /opt/intel/oneapi/setvars.sh
          set -e
          export CXX=$(which icpx)
          export CC=$(which icx)
          export CXXFLAGS="-fsycl ${CXXFLAGS}"

          cmake -S . -B build_sp         \
            -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DBUILD_SHARED_LIBS=ON       \
            -DCMAKE_VERBOSE_MAKEFILE=ON  \
            -DWarpX_COMPUTE=SYCL         \
            -DAMReX_SYCL_AOT=ON          \
            -DAMReX_INTEL_ARCH=pvc       \
            -DAMReX_PARALLEL_LINK_JOBS=4 \
            -DWarpX_EB=ON                \
            -DWarpX_LIB=ON               \
            -DWarpX_MPI=OFF              \
            -DWarpX_OPENPMD=ON           \
            -DWarpX_PRECISION=SINGLE
          cmake --build build_sp -j 2
          # TODO: re-enable -DWarpX_LIB=ON as soon as "dpcpp -fPIC"
          #       segfaults are fixed

          ccache -s
          du -hs ~/.cache/ccache

          # Skip this as it will copy the binary artifacts and we are
          # tight on disk space
          #   python3 -m pip install --upgrade pip
          #   python3 -m pip install --upgrade setuptools wheel
          #   PYWARPX_LIB_DIR=$PWD/build_sp/lib python3 -m pip wheel .
          #   python3 -m pip install *.whl
